name: Flutter checks and Android builds
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
concurrency:
  group: alteo-flutter-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-and-build:
    name: Verify and build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, admin, driver_partner, delivery_partner, seller, dark_store]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Report Flutter and Java versions
        run: |
          flutter --version
          java -version
      - name: Generate Android platform scaffold and OAuth redirect
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter create --platforms=android --project-name=alteo_${{ matrix.app }} .
          python3 - <<'PY'
          from pathlib import Path
          # Mapbox's AndroidX dependencies require a recent Android API compile SDK.
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              path = Path(name)
              if path.exists():
                  text = path.read_text()
                  text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  path.write_text(text)
          PY
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          redirect = '''        <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="alteo" android:host="login-callback" />
                </intent-filter>
          '''
          if 'android:scheme="alteo"' not in xml:
              xml = xml.replace('        </activity>', redirect + '        </activity>', 1)
              manifest.write_text(xml)
          PY
      - name: Resolve dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: flutter test --no-pub
      - name: Build release APK
        working-directory: apps/${{ matrix.app }}
        run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://nkerkoptbrcadlpxffkn.supabase.co' }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rZXJrb3B0YnJjYWRscHhmZmtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NzMzOTUsImV4cCI6MjEwODE0OTM5NX0.Ib5Lm42UvdAXURgH-g26Vp2i-UVM86vH2q4A-Ht1T1g' }}
          --dart-define=MAPBOX_PUBLIC_TOKEN=${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          --dart-define=CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alteo-${{ matrix.app }}-android-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
