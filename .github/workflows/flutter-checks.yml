name: Flutter checks and Android builds
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
concurrency:
  group: alteo-flutter-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-and-build:
    name: Verify and build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, admin, driver_partner, delivery_partner, seller, dark_store]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Report Flutter and Java versions
        run: |
          flutter --version
          java -version
      - name: Generate Android platform scaffold and OAuth redirect
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter create --platforms=android --project-name=alteo_${{ matrix.app }} .
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = '${{ matrix.app }}'
          package_ids = {
              'customer': 'com.alteo.customer',
              'admin': 'com.alteo.admin',
              'driver_partner': 'com.alteo.driverpartner',
              'delivery_partner': 'com.alteo.deliverypartner',
              'seller': 'com.alteo.seller',
              'dark_store': 'com.alteo.darkstore',
          }
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              path = Path(name)
              if path.exists():
                  data = path.read_text()
                  if path.suffix == '.kts':
                      data = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{package_ids[app]}"', data)
                  else:
                      data = re.sub(r'applicationId\s+"[^"]+"', f'applicationId "{package_ids[app]}"', data)
                  path.write_text(data)
          PY
          python3 - <<'PY'
          from pathlib import Path
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              path = Path(name)
              if path.exists():
                  text = path.read_text()
                  text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  path.write_text(text)
          PY
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          redirect = '''        <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="alteo" android:host="login-callback" />
                </intent-filter>
          '''
          if 'android:scheme="alteo"' not in xml:
              xml = xml.replace('        </activity>', redirect + '        </activity>', 1)
              manifest.write_text(xml)
          PY
      - name: Clean stale Android and Flutter outputs
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter clean
          rm -rf android/.gradle android/app/build
      - name: Pin compatible Android preferences plugin
        working-directory: apps/${{ matrix.app }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text()
          if 'dependency_overrides:' not in text:
              text += '\ndependency_overrides:\n  shared_preferences_android: 2.4.15\n'
          elif 'shared_preferences_android:' not in text:
              text += '\n  shared_preferences_android: 2.3.5\n'
          path.write_text(text)
          print('Pinned shared_preferences_android to 2.3.5 to avoid the observed Android Pigeon API mismatch')
          PY
      - name: Resolve compatible dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub upgrade
      - name: Raise Mapbox Android library compile SDK
        if: matrix.app == 'customer'
        working-directory: apps/customer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          matches = list(root.glob('mapbox_maps_flutter-*/android/build.gradle')) + list(root.glob('mapbox_maps_flutter-*/android/build.gradle.kts'))
          if not matches:
              raise SystemExit('Mapbox Android Gradle file not found in pub cache')
          for path in matches:
              original = path.read_text()
              lines = original.splitlines()
              found = False
              for i, line in enumerate(lines):
                  if re.match(r'^\s*compileSdk(?:Version)?\b', line):
                      indent = re.match(r'^\\s*', line).group(0)
                      if 'compileSdkVersion' in line:
                          lines[i] = indent + 'compileSdkVersion 36'
                      elif '=' in line:
                          lines[i] = indent + 'compileSdk = 36'
                      else:
                          lines[i] = indent + 'compileSdk 36'
                      found = True
              if not found:
                  raise SystemExit(f'No compileSdk declaration found in {path}; inspect plugin build file')
              updated = '\n'.join(lines) + '\n'
              path.write_text(updated)
              print(f'Patched {path}:')
              print('\n'.join(line for line in lines if 'compileSdk' in line))
          PY
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: flutter test --no-pub
      - name: Build release APK
        working-directory: apps/${{ matrix.app }}
        run: >-
          flutter build apk --release --no-pub
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://nkerkoptbrcadlpxffkn.supabase.co' }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rZXJrb3B0YnJjYWRscHhmZmtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NzMzOTUsImV4cCI6MjEwODE0OTM5NX0.Ib5Lm42UvdAXURgH-g26Vp2i-UVM86vH2q4A-Ht1T1g' }}
          --dart-define=MAPBOX_PUBLIC_TOKEN=${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          --dart-define=CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alteo-${{ matrix.app }}-android-apks
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
