name: Alteo Android APKs
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/flutter-checks.yml'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alteo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build ${{ matrix.name }} (arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: apps/customer
            name: customer
            project: alteo_customer
          - app: apps/admin
            name: admin
            project: alteo_admin
          - app: apps/seller
            name: seller
            project: alteo_seller
          - app: apps/driver_partner
            name: driver-partner
            project: alteo_driver_partner
          - app: apps/delivery_partner
            name: delivery-partner
            project: alteo_delivery_partner
          - app: apps/dark_store
            name: dark-store
            project: alteo_dark_store
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate Android project files if absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.alteo --project-name "${{ matrix.project }}" .
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build arm64 release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=MAPBOX_PUBLIC_TOKEN="$MAPBOX_PUBLIC_TOKEN"
      - name: Enforce APK size limit (15 MB)
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "APK size: $BYTES bytes"
          if [ "$BYTES" -gt 15000000 ]; then
            echo "APK exceeds the 15 MB release limit."
            exit 1
          fi
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: alteo-${{ matrix.name }}-arm64-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
