name: Alteo Android APKs
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/flutter-checks.yml'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alteo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build ${{ matrix.name }} (arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: apps/customer
            name: customer
            project: alteo_customer
            android_package: com.alteo.alteo_customer
            firebase_secret: FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_BASE64
            scheme: com.alteo.customer
            firebase_secret: FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_BASE64
          - app: apps/admin
            name: admin
            project: alteo_admin
            android_package: com.alteo.alteo_admin
            firebase_secret: FIREBASE_ADMIN_GOOGLE_SERVICES_JSON_BASE64
            scheme: com.alteo.admin
            firebase_secret: FIREBASE_ADMIN_GOOGLE_SERVICES_JSON_BASE64
          - app: apps/seller
            name: seller
            project: alteo_seller
            android_package: com.alteo.alteo_seller
            firebase_secret: FIREBASE_SELLER_GOOGLE_SERVICES_JSON_BASE64
            scheme: com.alteo.seller
            firebase_secret: FIREBASE_SELLER_GOOGLE_SERVICES_JSON_BASE64
          - app: apps/driver_partner
            name: driver-partner
            project: alteo_driver_partner
            android_package: com.alteo.alteo_driver_partner
            firebase_secret: FIREBASE_DRIVER_PARTNER_GOOGLE_SERVICES_JSON_BASE64
            scheme: com.alteo.driverpartner
            firebase_secret: FIREBASE_DRIVER_PARTNER_GOOGLE_SERVICES_JSON_BASE64
          - app: apps/delivery_partner
            name: delivery-partner
            project: alteo_delivery_partner
            android_package: com.alteo.alteo_delivery_partner
            firebase_secret: FIREBASE_DELIVERY_PARTNER_GOOGLE_SERVICES_JSON_BASE64
            scheme: com.alteo.deliverypartner
            firebase_secret: FIREBASE_DELIVERY_PARTNER_GOOGLE_SERVICES_JSON_BASE64
          - app: apps/dark_store
            name: dark-store
            project: alteo_dark_store
            android_package: com.alteo.alteo_dark_store
            firebase_secret: FIREBASE_DARK_STORE_GOOGLE_SERVICES_JSON_BASE64
            scheme: com.alteo.darkstore
            firebase_secret: FIREBASE_DARK_STORE_GOOGLE_SERVICES_JSON_BASE64
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate Android project files if absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.alteo --project-name "${{ matrix.project }}" .
          fi
      - name: Configure Firebase for this Android app when credentials are available
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets[matrix.firebase_secret] }}
          ALTEO_ANDROID_PACKAGE: ${{ matrix.android_package }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          encoded = os.environ.get("FIREBASE_ANDROID_CONFIG_BASE64", "").strip()
          if not encoded:
              print("Firebase Android config is not configured for this app yet; push notifications will remain disabled.")
              raise SystemExit(0)

          android_dir = Path("android")
          app_dir = android_dir / "app"
          config_path = app_dir / "google-services.json"
          config_path.write_bytes(base64.b64decode(encoded, validate=True))
          config = json.loads(config_path.read_text())
          clients = config.get("client", [])
          if not clients:
              raise SystemExit("Firebase google-services.json contains no Android clients.")
          app_id = clients[0].get("client_info", {}).get("android_client_info", {}).get("package_name", "")
          print("Firebase Android package configured:", app_id)
          expected_package = os.environ["ALTEO_ANDROID_PACKAGE"]
          packages = [
              item.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
              for item in clients
          ]
          if expected_package not in packages:
              raise SystemExit(
                  f"Firebase config package mismatch: expected {expected_package}; got {packages}"
              )
          print("Firebase Android package verified:", expected_package)

          settings = next((p for p in (android_dir / "settings.gradle.kts", android_dir / "settings.gradle") if p.exists()), None)
          app_gradle = next((p for p in (app_dir / "build.gradle.kts", app_dir / "build.gradle") if p.exists()), None)
          if settings is None or app_gradle is None:
              raise SystemExit("Could not locate generated Android Gradle files.")

          settings_text = settings.read_text()
          if "com.google.gms.google-services" not in settings_text:
              settings_text = re.sub(
                  r"(plugins\s*\{)",
                  r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  settings_text,
                  count=1,
              )
              if settings_text == settings.read_text():
                  raise SystemExit("Could not add the Google Services Gradle plugin to settings.")
              settings.write_text(settings_text)

          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text = re.sub(
                  r"(plugins\\s*\\{)",
                  r'\1\n    id("com.google.gms.google-services")',
                  app_text,
                  count=1,
              )
              if app_text == app_gradle.read_text():
                  raise SystemExit("Could not apply the Google Services Gradle plugin.")
              app_gradle.write_text(app_text)
          PY
      - name: Configure permanent Android release signing
        env:
          ALTEO_ANDROID_KEYSTORE_BASE64: ${{ secrets.ALTEO_ANDROID_KEYSTORE_BASE64 }}
          ALTEO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEYSTORE_PASSWORD }}
          ALTEO_ANDROID_KEY_ALIAS: ${{ secrets.ALTEO_ANDROID_KEY_ALIAS }}
          ALTEO_ANDROID_KEY_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = [
              "ALTEO_ANDROID_KEYSTORE_BASE64",
              "ALTEO_ANDROID_KEYSTORE_PASSWORD",
              "ALTEO_ANDROID_KEY_ALIAS",
              "ALTEO_ANDROID_KEY_PASSWORD",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          android_dir = Path("android/app")
          android_dir.mkdir(parents=True, exist_ok=True)
          (android_dir / "alteo-release.jks").write_bytes(
              base64.b64decode(os.environ["ALTEO_ANDROID_KEYSTORE_BASE64"], validate=True)
          )

          gradle = next(
              (path for path in (android_dir / "build.gradle.kts", android_dir / "build.gradle") if path.exists()),
              None,
          )
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated")

          source = gradle.read_text()
          marker = "// ALTEO_PERMANENT_RELEASE_SIGNING"
          if marker not in source:
              if gradle.suffix == ".kts":
                  config = '''
              // ALTEO_PERMANENT_RELEASE_SIGNING
              signingConfigs {
                  create("alteoRelease") {
                      keyAlias = System.getenv("ALTEO_ANDROID_KEY_ALIAS") ?: error("Missing ALTEO_ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ALTEO_ANDROID_KEY_PASSWORD") ?: error("Missing ALTEO_ANDROID_KEY_PASSWORD")
                      storeFile = file("alteo-release.jks")
                      storePassword = System.getenv("ALTEO_ANDROID_KEYSTORE_PASSWORD") ?: error("Missing ALTEO_ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          '''
                  target = 'signingConfig = signingConfigs.getByName("debug")'
                  replacement = 'signingConfig = signingConfigs.getByName("alteoRelease")'
                  if target not in source:
                      raise SystemExit("Could not locate the generated Kotlin release signing setting")
                  source = source.replace(target, replacement, 1)
              else:
                  config = '''
              // ALTEO_PERMANENT_RELEASE_SIGNING
              signingConfigs {
                  alteoRelease {
                      keyAlias System.getenv("ALTEO_ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ALTEO_ANDROID_KEY_PASSWORD")
                      storeFile file("alteo-release.jks")
                      storePassword System.getenv("ALTEO_ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          '''
                  target = "signingConfig signingConfigs.debug"
                  replacement = "signingConfig signingConfigs.alteoRelease"
                  if target not in source:
                      raise SystemExit("Could not locate the generated Groovy release signing setting")
                  source = source.replace(target, replacement, 1)

              start = source.find("android {")
              if start < 0:
                  raise SystemExit("Android Gradle block not found")
              depth = 0
              quote = None
              escaped = False
              end = None
              for i in range(start + len("android"), len(source)):
                  ch = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit("Could not locate the end of the Android Gradle block")
              build_types = source.find("buildTypes {", start, end)
              if build_types >= 0:
                  source = source[:build_types] + config + "\n    " + source[build_types:]
              else:
                  source = source[:end] + config + "\n    " + source[end:]
              gradle.write_text(source)

          print("Permanent release signing is configured; keystore material was not printed.")
          PY
      - name: Configure Google OAuth deep links and microphone permission
        env:
          ALTEO_REDIRECT_SCHEME: ${{ matrix.scheme }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not generated")
          text = manifest.read_text()
          permissions = [
              # Release APKs need network access for Supabase OAuth code exchange and API calls.
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
          ]
          for permission_name in permissions:
              if f'android:name="{permission_name}"' not in text:
                  text = text.replace("<application", f'    <uses-permission android:name="{permission_name}" />\n    <application', 1)
          if "android.speech.RecognitionService" not in text:
              queries = '    <queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n    </queries>\n'
              text = text.replace("<application", queries + "    <application", 1)
          scheme = os.environ["ALTEO_REDIRECT_SCHEME"]
          if f'android:scheme="{scheme}"' not in text:
              start = text.find('<activity')
              end = text.find('</activity>', start)
              if start < 0 or end < 0:
                  raise SystemExit("Main Android activity was not found")
              deep_link = f'''            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="{scheme}" android:host="login-callback" />
                      </intent-filter>
          '''
              text = text[:end] + deep_link + text[end:]
          manifest.write_text(text)
          print("Configured OAuth deep link and voice-search permission:", scheme)
          PY
      - name: Compress native libraries inside APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file was not found")
          source = gradle.read_text()
          setting = "packaging { jniLibs { useLegacyPackaging = true } }"
          if "useLegacyPackaging" not in source:
              # Insert into the app-level android block, not the top-level plugins block.
              start = source.find("android {")
              if start < 0:
                  raise SystemExit("Android Gradle block was not found")
              depth = 0
              quote = None
              escaped = False
              end = None
              for i in range(start + len("android"), len(source)):
                  ch = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit("Could not locate end of Android Gradle block")
              source = source[:end] + "\n    " + setting + "\n" + source[end:]
              gradle.write_text(source)
          print("Enabled legacy JNI packaging in", gradle)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build arm64 release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ALTEO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEYSTORE_PASSWORD }}
          ALTEO_ANDROID_KEY_ALIAS: ${{ secrets.ALTEO_ANDROID_KEY_ALIAS }}
          ALTEO_ANDROID_KEY_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=MAPBOX_PUBLIC_TOKEN="$MAPBOX_PUBLIC_TOKEN" --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Enforce APK size limit (15 MB)
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "APK size: $BYTES bytes"
          if [ "$BYTES" -gt 15000000 ]; then
            echo "APK exceeds the 15 MB release limit."
            exit 1
          fi
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: alteo-${{ matrix.name }}-arm64-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
