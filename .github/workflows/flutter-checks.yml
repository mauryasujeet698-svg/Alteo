name: Alteo Android APKs
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/flutter-checks.yml'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alteo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build ${{ matrix.name }} (arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: apps/customer
            name: customer
            project: alteo_customer
            android_package: com.alteo.alteo_customer
            scheme: com.alteo.customer
          - app: apps/admin
            name: admin
            project: alteo_admin
            android_package: com.alteo.alteo_admin
            scheme: com.alteo.admin
          - app: apps/seller
            name: seller
            project: alteo_seller
            android_package: com.alteo.alteo_seller
            scheme: com.alteo.seller
          - app: apps/driver_partner
            name: driver-partner
            project: alteo_driver_partner
            android_package: com.alteo.alteo_driver_partner
            scheme: com.alteo.driverpartner
          - app: apps/delivery_partner
            name: delivery-partner
            project: alteo_delivery_partner
            android_package: com.alteo.alteo_delivery_partner
            scheme: com.alteo.deliverypartner
          - app: apps/dark_store
            name: dark-store
            project: alteo_dark_store
            android_package: com.alteo.alteo_dark_store
            scheme: com.alteo.darkstore
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate Android project files if absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.alteo --project-name "${{ matrix.project }}" .
          fi
      - name: Generate app-specific Android launcher icons
        env:
          ALTEO_APP_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, struct, zlib
          from pathlib import Path

          profiles = {
              "customer": ("#08765D", "A", (255, 164, 26)),
              "admin": ("#155C4B", "M", (255, 255, 255)),
              "seller": ("#E57C00", "S", (255, 255, 255)),
              "delivery-partner": ("#D9364A", "D", (255, 255, 255)),
              "driver-partner": ("#2463D4", "R", (255, 255, 255)),
              "dark-store": ("#7637C8", "W", (255, 255, 255)),
          }
          name = os.environ["ALTEO_APP_NAME"]
          display_names = {"customer":"Alteo", "admin":"Alteo Admin", "seller":"Alteo Seller", "delivery-partner":"Alteo Delivery", "driver-partner":"Alteo Driver", "dark-store":"Alteo Dark Store"}
          bg_hex, glyph, accent = profiles[name]
          bg = tuple(int(bg_hex[i:i+2], 16) for i in (1, 3, 5))
          font = {
              "A": ["01110","10001","10001","11111","10001","10001","10001"],
              "M": ["10001","11011","10101","10101","10001","10001","10001"],
              "S": ["01111","10000","10000","01110","00001","00001","11110"],
              "D": ["11110","10001","10001","10001","10001","10001","11110"],
              "R": ["11110","10001","10001","11110","10100","10010","10001"],
              "W": ["10001","10001","10001","10101","10101","10101","01010"],
          }[glyph]

          def render(size):
              pixels = [[(0,0,0,0) for _ in range(size)] for _ in range(size)]
              margin = size // 12
              radius = size // 5
              for y in range(size):
                  for x in range(size):
                      cx = min(max(x, margin + radius), size - margin - radius - 1)
                      cy = min(max(y, margin + radius), size - margin - radius - 1)
                      if (x-cx)**2 + (y-cy)**2 <= radius**2 or (margin+radius <= x < size-margin-radius and margin <= y < size-margin) or (margin <= x < size-margin and margin+radius <= y < size-margin-radius):
                          pixels[y][x] = (*bg,255)
              scale = size // 11
              gw, gh = 5*scale, 7*scale
              ox, oy = (size-gw)//2, (size-gh)//2
              for row, bits in enumerate(font):
                  for col, bit in enumerate(bits):
                      if bit == "1":
                          for yy in range(oy+row*scale, oy+(row+1)*scale):
                              for xx in range(ox+col*scale, ox+(col+1)*scale):
                                  pixels[yy][xx] = (255,255,255,255)
              dot = max(3, size//14)
              dx, dy = size - margin - dot - 1, margin + 1
              for y in range(max(0,dy-dot), min(size,dy+dot)):
                  for x in range(max(0,dx-dot), min(size,dx+dot)):
                      if (x-dx)**2+(y-dy)**2 <= dot**2:
                          pixels[y][x] = (*accent,255)
              raw = b"".join(b"\x00" + b"".join(bytes(px) for px in row) for row in pixels)
              def chunk(kind, data):
                  return struct.pack(">I",len(data))+kind+data+struct.pack(">I",zlib.crc32(kind+data)&0xffffffff)
              return b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">2I5B",size,size,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(raw,9))+chunk(b"IEND",b"")

          res = Path("android/app/src/main/res")
          for density, size in [("mipmap-mdpi",48),("mipmap-hdpi",72),("mipmap-xhdpi",96),("mipmap-xxhdpi",144),("mipmap-xxxhdpi",192)]:
              folder = res / density
              folder.mkdir(parents=True, exist_ok=True)
              png = render(size)
              (folder/"ic_launcher.png").write_bytes(png)
              (folder/"ic_launcher_round.png").write_bytes(png)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          import re
          if re.search(r'android:icon="[^"]+"', source):
              source = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', source, count=1)
          else:
              source = source.replace('<application', '<application android:icon="@mipmap/ic_launcher"', 1)
          if 'android:roundIcon=' in source:
              source = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', source, count=1)
          else:
              source = source.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
          if re.search(r'android:label="[^"]+"', source):
              source = re.sub(r'android:label="[^"]+"', 'android:label="' + display_names[name] + '"', source, count=1)
          else:
              source = source.replace('<application', '<application android:label="' + display_names[name] + '"', 1)
          manifest.write_text(source)
          print("Generated custom Alteo launcher branding for", name)
          PY
      - name: Configure Firebase for this Android app when credentials are available
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          ALTEO_ANDROID_PACKAGE: ${{ matrix.android_package }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          encoded = os.environ.get("FIREBASE_ANDROID_CONFIG_BASE64", "").strip()
          if not encoded:
              print("Firebase Android config is not configured for this app yet; push notifications will remain disabled.")
              raise SystemExit(0)

          android_dir = Path("android")
          app_dir = android_dir / "app"
          config_path = app_dir / "google-services.json"
          config_path.write_bytes(base64.b64decode(encoded, validate=True))
          config = json.loads(config_path.read_text())
          clients = config.get("client", [])
          if not clients:
              raise SystemExit("Firebase google-services.json contains no Android clients.")
          app_id = clients[0].get("client_info", {}).get("android_client_info", {}).get("package_name", "")
          print("Firebase Android package configured:", app_id)
          expected_package = os.environ["ALTEO_ANDROID_PACKAGE"]
          packages = [
              item.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
              for item in clients
          ]
          if expected_package not in packages:
              raise SystemExit(
                  f"Firebase config package mismatch: expected {expected_package}; got {packages}"
              )
          print("Firebase Android package verified:", expected_package)

          settings = next((p for p in (android_dir / "settings.gradle.kts", android_dir / "settings.gradle") if p.exists()), None)
          app_gradle = next((p for p in (app_dir / "build.gradle.kts", app_dir / "build.gradle") if p.exists()), None)
          if settings is None or app_gradle is None:
              raise SystemExit("Could not locate generated Android Gradle files.")

          settings_text = settings.read_text()
          if "com.google.gms.google-services" not in settings_text:
              settings_text = re.sub(
                  r"(plugins\s*\{)",
                  r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  settings_text,
                  count=1,
              )
              if settings_text == settings.read_text():
                  raise SystemExit("Could not add the Google Services Gradle plugin to settings.")
              settings.write_text(settings_text)

          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text = re.sub(
                  r"(plugins\s*\{)",
                  r'\1\n    id("com.google.gms.google-services")',
                  app_text,
                  count=1,
              )
              if app_text == app_gradle.read_text():
                  raise SystemExit("Could not apply the Google Services Gradle plugin.")
              app_gradle.write_text(app_text)
          PY
      - name: Configure permanent Android release signing
        env:
          ALTEO_ANDROID_KEYSTORE_BASE64: ${{ secrets.ALTEO_ANDROID_KEYSTORE_BASE64 }}
          ALTEO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEYSTORE_PASSWORD }}
          ALTEO_ANDROID_KEY_ALIAS: ${{ secrets.ALTEO_ANDROID_KEY_ALIAS }}
          ALTEO_ANDROID_KEY_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = [
              "ALTEO_ANDROID_KEYSTORE_BASE64",
              "ALTEO_ANDROID_KEYSTORE_PASSWORD",
              "ALTEO_ANDROID_KEY_ALIAS",
              "ALTEO_ANDROID_KEY_PASSWORD",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          android_dir = Path("android/app")
          android_dir.mkdir(parents=True, exist_ok=True)
          (android_dir / "alteo-release.jks").write_bytes(
              base64.b64decode(os.environ["ALTEO_ANDROID_KEYSTORE_BASE64"], validate=True)
          )

          gradle = next(
              (path for path in (android_dir / "build.gradle.kts", android_dir / "build.gradle") if path.exists()),
              None,
          )
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated")

          source = gradle.read_text()
          marker = "// ALTEO_PERMANENT_RELEASE_SIGNING"
          if marker not in source:
              if gradle.suffix == ".kts":
                  config = '''
              // ALTEO_PERMANENT_RELEASE_SIGNING
              signingConfigs {
                  create("alteoRelease") {
                      keyAlias = System.getenv("ALTEO_ANDROID_KEY_ALIAS") ?: error("Missing ALTEO_ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ALTEO_ANDROID_KEY_PASSWORD") ?: error("Missing ALTEO_ANDROID_KEY_PASSWORD")
                      storeFile = file("alteo-release.jks")
                      storePassword = System.getenv("ALTEO_ANDROID_KEYSTORE_PASSWORD") ?: error("Missing ALTEO_ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          '''
                  target = 'signingConfig = signingConfigs.getByName("debug")'
                  replacement = 'signingConfig = signingConfigs.getByName("alteoRelease")'
                  if target not in source:
                      raise SystemExit("Could not locate the generated Kotlin release signing setting")
                  source = source.replace(target, replacement, 1)
              else:
                  config = '''
              // ALTEO_PERMANENT_RELEASE_SIGNING
              signingConfigs {
                  alteoRelease {
                      keyAlias System.getenv("ALTEO_ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ALTEO_ANDROID_KEY_PASSWORD")
                      storeFile file("alteo-release.jks")
                      storePassword System.getenv("ALTEO_ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          '''
                  target = "signingConfig signingConfigs.debug"
                  replacement = "signingConfig signingConfigs.alteoRelease"
                  if target not in source:
                      raise SystemExit("Could not locate the generated Groovy release signing setting")
                  source = source.replace(target, replacement, 1)

              start = source.find("android {")
              if start < 0:
                  raise SystemExit("Android Gradle block not found")
              depth = 0
              quote = None
              escaped = False
              end = None
              for i in range(start + len("android"), len(source)):
                  ch = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit("Could not locate the end of the Android Gradle block")
              build_types = source.find("buildTypes {", start, end)
              if build_types >= 0:
                  source = source[:build_types] + config + "\n    " + source[build_types:]
              else:
                  source = source[:end] + config + "\n    " + source[end:]
              gradle.write_text(source)

          print("Permanent release signing is configured; keystore material was not printed.")
          PY
      - name: Configure Google OAuth deep links and microphone permission
        env:
          ALTEO_REDIRECT_SCHEME: ${{ matrix.scheme }}
          ALTEO_APP_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not generated")
          text = manifest.read_text()
          permissions = [
              # Release APKs need network access for APIs/OAuth and speech input for Customer search.
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
          ]
          # Preserve the Customer APK's previous manifest permissions byte-for-byte in scope.
          # Operational partner apps request these permissions on first launch; Admin does not.
          if os.environ.get("ALTEO_APP_NAME") in {"customer", "seller", "driver-partner", "delivery-partner", "dark-store"}:
              permissions.extend([
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.POST_NOTIFICATIONS",
              ])
          for permission_name in permissions:
              if f'android:name="{permission_name}"' not in text:
                  text = text.replace("<application", f'    <uses-permission android:name="{permission_name}" />\n    <application', 1)
          if "android.speech.RecognitionService" not in text:
              queries = '    <queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n    </queries>\n'
              text = text.replace("<application", queries + "    <application", 1)
          scheme = os.environ["ALTEO_REDIRECT_SCHEME"]
          if f'android:scheme="{scheme}"' not in text:
              start = text.find('<activity')
              end = text.find('</activity>', start)
              if start < 0 or end < 0:
                  raise SystemExit("Main Android activity was not found")
              deep_link = f'''            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="{scheme}" android:host="login-callback" />
                      </intent-filter>
          '''
              text = text[:end] + deep_link + text[end:]
          manifest.write_text(text)
          print("Configured OAuth deep link and voice-search permission:", scheme)
          PY
      - name: Set Android SDK levels for Google Play
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Generated Android Gradle file was not found.")
          source = gradle.read_text()

          if gradle.suffix == ".kts":
              source, compile_count = re.subn(
                  r"compileSdk\s*=\s*flutter\.compileSdkVersion",
                  "compileSdk = 36",
                  source,
                  count=1,
              )
              source, target_count = re.subn(
                  r"targetSdk\s*=\s*flutter\.targetSdkVersion",
                  "targetSdk = 36",
                  source,
                  count=1,
              )
              if compile_count == 0 and "compileSdk = 36" not in source:
                  raise SystemExit("Could not set compileSdk to Android API 36.")
              if target_count == 0 and "targetSdk = 36" not in source:
                  raise SystemExit("Could not set targetSdk to Android API 36.")
          else:
              source, compile_count = re.subn(
                  r"compileSdkVersion\s+flutter\.compileSdkVersion",
                  "compileSdkVersion 36",
                  source,
                  count=1,
              )
              source, target_count = re.subn(
                  r"targetSdkVersion\s+flutter\.targetSdkVersion",
                  "targetSdkVersion 36",
                  source,
                  count=1,
              )
              if compile_count == 0 and not re.search(r"compileSdkVersion\s+36", source):
                  raise SystemExit("Could not set compileSdk to Android API 36.")
              if target_count == 0 and not re.search(r"targetSdkVersion\s+36", source):
                  raise SystemExit("Could not set targetSdk to Android API 36.")

          gradle.write_text(source)
          print("Configured compileSdk and targetSdk to Android API 36.")
          PY
      - name: Compress native libraries inside APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file was not found")
          source = gradle.read_text()

          # firebase_messaging's local-notifications integration needs Java 8+
          # core library desugaring in Android release builds.
          if "isCoreLibraryDesugaringEnabled = true" not in source and "coreLibraryDesugaringEnabled true" not in source:
              if "compileOptions {" in source:
                  source = source.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true" if gradle.suffix == ".kts"
                      else "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1,
                  )
              else:
                  raise SystemExit("Android Gradle compileOptions block was not found for desugaring.")
          if gradle.suffix == ".kts":
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              dep_line = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              dep_line = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dependency not in source:
              if "dependencies {" in source:
                  source = source.replace("dependencies {", "dependencies {\n" + dep_line, 1)
              else:
                  source += "\ndependencies {\n" + dep_line + "\n}\n"

          setting = "packaging { jniLibs { useLegacyPackaging = true } }"
          if "useLegacyPackaging" not in source:
              # Insert into the app-level android block, not the top-level plugins block.
              start = source.find("android {")
              if start < 0:
                  raise SystemExit("Android Gradle block was not found")
              depth = 0
              quote = None
              escaped = False
              end = None
              for i in range(start + len("android"), len(source)):
                  ch = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit("Could not locate end of Android Gradle block")
              source = source[:end] + "\n    " + setting + "\n" + source[end:]
              gradle.write_text(source)
          print("Enabled legacy JNI packaging in", gradle)
          PY
      - name: Verify Mapbox public token configuration
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN || secrets.MAPBOX_TOKEN || secrets.MAPBOX_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$MAPBOX_PUBLIC_TOKEN" ]; then
            echo "::warning::MAPBOX_PUBLIC_TOKEN is not configured. Customer ride maps will use the fallback map, and address search/road ETAs will remain unavailable. Add a restricted public Mapbox pk. token in GitHub Actions secrets."
            exit 0
          fi
          case "$MAPBOX_PUBLIC_TOKEN" in
            pk.*) echo "Mapbox public token is present (value hidden)." ;;
            *) echo "::warning::MAPBOX_PUBLIC_TOKEN does not look like a Mapbox public pk. token. Value hidden; check the Actions secret." ; exit 0 ;;
          esac
          STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --get --data-urlencode "access_token=$MAPBOX_PUBLIC_TOKEN" "https://api.mapbox.com/styles/v1/mapbox/streets-v12" || true)
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Mapbox token check returned HTTP $STATUS. Check token scopes (styles:read/styles:tiles, geocoding:read, directions:read) and account access. Token value is hidden."
          else
            echo "Mapbox Streets style endpoint is accessible with the configured public token."
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Align Android plugin compile SDKs
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          # Flutter may place hosted packages in a custom PUB_CACHE, so search
          # the runner home rather than assuming one exact cache subdirectory.
          home = Path.home()
          candidates = [
              path for path in home.rglob("build.gradle*")
              if "geocoding_android-" in str(path) and path.parent.name == "android"
          ]
          if not candidates:
              # Not every app uses the geocoding plugin. Only the Customer app
              # currently needs this compatibility patch; unrelated apps must continue.
              print("geocoding_android is not a dependency of this app; no SDK patch needed.")
              raise SystemExit(0)
          patched = []
          for path in candidates:
              source = path.read_text()
              lines = source.splitlines(keepends=True)
              changed = False
              for i, line in enumerate(lines):
                  if "compileSdk" in line and re.search(r"\b33\b", line):
                      lines[i] = re.sub(r"\b33\b", "36", line)
                      changed = changed or lines[i] != line
              if changed:
                  path.write_text("".join(lines))
                  patched.append(str(path))
          if patched:
              print("Aligned geocoding_android compile SDK to API 36:", ", ".join(patched))
          else:
              content = "\n".join(path.read_text() for path in candidates)
              if re.search(r"compileSdk[^\n]*\b33\b", content):
                  print(content)
                  raise SystemExit("Unable to patch geocoding_android compile SDK declaration.")
              print("geocoding_android has no hardcoded API 33 compileSdk declaration.")
          PY
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        run: flutter test
      - name: Build arm64 release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN || secrets.MAPBOX_TOKEN || secrets.MAPBOX_ACCESS_TOKEN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ALTEO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEYSTORE_PASSWORD }}
          ALTEO_ANDROID_KEY_ALIAS: ${{ secrets.ALTEO_ANDROID_KEY_ALIAS }}
          ALTEO_ANDROID_KEY_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=MAPBOX_PUBLIC_TOKEN="$MAPBOX_PUBLIC_TOKEN" --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Enforce APK size limit (15 MB)
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "APK size: $BYTES bytes"
          if [ "$BYTES" -gt 15000000 ]; then
            echo "APK exceeds the 15 MB release limit."
            exit 1
          fi
      - name: Build signed Android App Bundle for Google Play
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN || secrets.MAPBOX_TOKEN || secrets.MAPBOX_ACCESS_TOKEN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ALTEO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEYSTORE_PASSWORD }}
          ALTEO_ANDROID_KEY_ALIAS: ${{ secrets.ALTEO_ANDROID_KEY_ALIAS }}
          ALTEO_ANDROID_KEY_PASSWORD: ${{ secrets.ALTEO_ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --dart-define=MAPBOX_PUBLIC_TOKEN="$MAPBOX_PUBLIC_TOKEN" --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Verify signed Android App Bundle
        shell: bash
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          echo "Signed Android App Bundle created: $(stat -c%s "$AAB") bytes"
      - name: Upload Android App Bundle for Play Store
        uses: actions/upload-artifact@v4
        with:
          name: alteo-${{ matrix.name }}-play-store-aab
          path: ${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: alteo-${{ matrix.name }}-arm64-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
